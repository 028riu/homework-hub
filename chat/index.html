<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Homework Hub — Chat</title>
<link rel="stylesheet" href="chat.css?v=20260921-1">
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <a href="../" class="brand">📚 <span>Homework Hub</span></a>
  <div class="me-wrap"><span id="me" class="me">Chưa đăng nhập</span><button id="logout" class="logout" title="Đăng xuất" hidden>↪</button></div>
</header>
<main class="chat-layout">
  <aside id="usersPanel" class="users-panel">
    <div class="panel-head">
      <div><p>HOMEWORK HUB</p><h1>Chat</h1></div>
    </div>
    <div id="loginBox" class="login-box" hidden>
      <div class="login-icon">🔐</div>
      <p>Đăng nhập Google để chat với các thành viên Homework Hub.</p>
      <button id="login" class="google">G&nbsp; Đăng nhập Google</button>
    </div>
    <div class="chat-tabs"><button id="peopleTab" class="tab active">Người dùng</button><button id="groupTab" class="tab">👥 Nhóm chung</button></div>
    <label class="search">🔎 <input id="userSearch" placeholder="Tìm người dùng..." autocomplete="off"></label>
    <div id="users" class="users"><span class="muted">Đăng nhập để bắt đầu.</span></div>
  </aside>
  <section class="conversation">
    <div id="emptyChat" class="empty-chat">
      <div>💬</div><h2>Chọn một người để bắt đầu</h2><p>Chat riêng, nhóm chung và realtime.</p>
      <button id="emptyLogin" class="empty-login" hidden>🔐 Đăng nhập Google</button>
    </div>
    <div id="chatPanel" class="chat-panel" hidden>
      <header class="chat-head">
        <button id="backUsers" class="back" title="Quay lại">←</button>
        <img id="chatAvatar" alt="Ảnh đại diện cuộc trò chuyện">
        <div class="chat-title"><h2 id="chatName">—</h2><p id="chatStatus">offline</p></div>
        <span id="typing" class="typing"></span>
      </header>
      <div id="messages" class="messages"></div>
      <div id="emojiBar" class="emoji-bar" hidden><button>😀</button><button>😂</button><button>❤️</button><button>👍</button><button>🔥</button><button>😭</button><button>😮</button><button>🎉</button></div>
      <form id="composer" class="composer">
        <button type="button" id="emoji" class="emoji-btn" title="Emoji" aria-label="Emoji">☺</button>
        <input id="messageInput" maxlength="2000" placeholder="Nhập tin nhắn..." autocomplete="off">
        <button type="submit" id="sendBtn">Gửi</button>
      </form>
      <div id="sendHint" class="send-hint"></div>
    </div>
  </section>
</main>
</div>
<script type="module" src="chat.js?v=20260921-1"></script>
</body>
</html>
