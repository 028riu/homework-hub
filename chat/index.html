<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a16"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Homework Hub Chat — chat riêng và nhóm realtime"><link rel="manifest" href="manifest.webmanifest"><title>Homework Hub — Chat</title><link rel="stylesheet" href="chat.css?v=20260921-3"></head><body><div class="app-shell"><header class="topbar"><a href="../" class="brand">📚 <span>Homework Hub</span></a><div class="me-wrap"><span id="me" class="me">Chưa đăng nhập</span><button id="logout" class="logout" title="Đăng xuất" hidden>↪</button></div></header><main id="chatLayout" class="chat-layout"><aside id="usersPanel" class="users-panel"><div class="panel-head"><div><p>HOMEWORK HUB</p><h1>Chat</h1></div><button id="installBtn" class="install-btn" hidden>＋ App</button></div><div id="loginBox" class="login-box" hidden><div class="login-icon">🔐</div><p>Đăng nhập Google để chat với các thành viên Homework Hub.</p><button id="login" class="google">G&nbsp; Đăng nhập Google</button></div><div class="chat-tabs"><button id="peopleTab" class="tab active">Người dùng</button><button id="groupTab" class="tab">👥 Nhóm chung</button></div><label class="search">🔎 <input id="userSearch" placeholder="Tìm người dùng..." autocomplete="off"></label><div class="device-tip" id="deviceTip"></div><div id="users" class="users"><span class="muted">Đăng nhập để bắt đầu.</span></div></aside><section class="conversation"><div id="emptyChat" class="empty-chat"><div>💬</div><h2>Chọn một người để bắt đầu</h2><p>Chat riêng, nhóm chung và realtime.</p><button id="emptyLogin" class="empty-login" hidden>🔐 Đăng nhập Google</button></div><div id="chatPanel" class="chat-panel" hidden><header class="chat-head"><button id="backUsers" class="back" title="Quay lại">←</button><i
