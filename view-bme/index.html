<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>Homework Hub — View BME</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f8fc,#eef2ff);color:#182230}.wrap{width:min(1000px,calc(100% - 28px));margin:auto;padding:28px 0 50px}.head{background:rgba(255,255,255,.9);border:1px solid #e6e9f0;border-radius:24px;padding:26px;box-shadow:0 12px 35px rgba(31,41,55,.08);margin-bottom:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:#667085}.head h1{margin:7px 0 6px;font-size:clamp(27px,5vw,40px)}.muted{color:#667085}.tools{display:flex;gap:10px;align-items:center;margin-top:18px}.search{width:100%;padding:13px 15px;border:1px solid #dfe3ea;border-radius:14px;background:#fff;font:inherit;outline:none}.search:focus{border-color:#818cf8;box-shadow:0 0 0 3px #818cf822}.status{margin-top:10px;font-size:13px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:21px;margin:13px 0;box-shadow:0 8px 25px rgba(31,41,55,.06)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.subject{font-weight:800;color:#4f46e5}.date{font-size:13px;color:#667085}.card h2{margin:12px 0 10px;font-size:22px}.content{white-space:pre-wrap;line-height:1.75}.due{margin:13px 0 0;color:#667085}.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.links a{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border-radius:12px;border:1px solid #dfe3ea;text-decoration:none;color:#344054;background:#fff;font-weight:700}.links a:hover{background:#f5f7ff;border-color:#a5b4fc}.empty{background:#fff;border:1px dashed #cfd5df;border-radius:20px;padding:32px;text-align:center;color:#667085}.error{background:#fff1f2;border:1px solid #fecdd3;color:#be123c;border-radius:16px;padding:16px;line-height:1.5}.count{font-weight:800;color:#344054}@media(max-width:600px){.wrap{width:min(100% - 18px,1000px);padding-top:10px}.head{padding:20px;border-radius:19px}.top{align-items:flex-start;flex-direction:column;gap:4px}.card{padding:17px}}
</style>
</head>
<body>
<main class="wrap">
<section class="head">
<div class="eyebrow">PARENT VIEW · HOMEWORK HUB</div>
<h1>👨‍👩‍👧 Bài tập</h1>
<div class="muted">Danh sách bài tập dành cho phụ huynh. Không hiển thị đáp án hay dữ liệu riêng của học sinh.</div>
<div class="tools"><input id="search" class="search" type="search" autocomplete="off" placeholder="🔎 Tìm bài tập, môn học..."></div>
<div id="status" class="status muted">⏳ Đang kết nối Firebase...</div>
</section>
<section id="list"></section>
<div id="empty" class="empty" hidden>📭 Chưa có bài tập BME.</div>
<div id="error" class="error" hidden></div>
</main>
<script type="module" src="./view-bme.js?v=20260901-3"></script>
</body>
</html>
