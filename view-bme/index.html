<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>Homework Hub — View BME</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#202534;margin:0}.wrap{max-width:980px;margin:auto;padding:28px 18px}.head,.card,.empty{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(16,24,40,.04)}.head h1{margin:5px 0}.muted,.date{color:#667085}.search{width:100%;padding:12px 14px;border:1px solid #dfe3ea;border-radius:12px;font:inherit;margin-top:14px;outline:none}.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.subject{font-weight:800;color:#4f46e5}.card h2{font-size:21px;margin:12px 0}.content{white-space:pre-wrap;line-height:1.7}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.links a{padding:9px 12px;border:1px solid #dfe3ea;border-radius:10px;text-decoration:none;color:#344054;background:#fff}.links a:hover{background:#f8fafc}.error{color:#b42318;background:#fef3f2;border:1px solid #fecdca;border-radius:12px;padding:14px}.loading{color:#667085;text-align:center;padding:28px}.count{font-size:13px;color:#667085;margin-top:8px}
</style>
</head>
<body>
<main class="wrap">
<section class="head">
<div class="muted">PARENT VIEW</div>
<h1>👨‍👩‍👧 Bài tập</h1>
<div class="muted">Danh sách bài tập dành cho phụ huynh.</div>
<input id="search" class="search" type="search" placeholder="🔎 Tìm bài tập...">
<div id="count" class="count"></div>
</section>
<section id="status" class="loading">⏳ Đang tải bài tập...</section>
<section id="list"></section>
<div id="empty" class="empty" hidden>📭 Chưa có bài tập.</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { firebaseConfig } from "../js/firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let data = [];
let subjects = [];
let search = "";
let subjectsReady = false;
let bmeReady = false;

const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;"
}[char]));

const timestampDate = value => {
  try {
    if (!value) return null;
    if (typeof value.toDate === "function") return value.toDate();
    if (typeof value.seconds === "number") return new Date(value.seconds * 1000);
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? null : d;
  } catch (_) { return null; }
};

const fmt = value => {
  const d = timestampDate(value);
  return d ? d.toLocaleString("vi-VN") : "";
};

const linksOf = item => {
  if (Array.isArray(item?.links)) return item.links.filter(Boolean).map(String);
  if (item?.link) return [String(item.link)];
  if (item?.url) return [String(item.url)];
  return [];
};

const createdTime = item => {
  const d = timestampDate(item?.createdAt || item?.updatedAt);
  return d ? d.getTime() : 0;
};

function render() {
  const queryText = search.trim().toLowerCase();
  const filtered = data
    .filter(item => `${item.title || ""} ${item.content || ""}`.toLowerCase().includes(queryText))
    .sort((a,b) => createdTime(b) - createdTime(a));

  $("status").hidden = true;
  $("empty").hidden = filtered.length > 0;
  $("count").textContent = `${filtered.length} bài tập`;

  $("list").innerHTML = filtered.map(item => {
    const subject = subjects.find(s => s.id === item.subjectId);
    const links = linksOf(item);
    return `<article class="card">
      <div class="top">
        <span class="subject">${esc(subject?.icon || item.subjectIcon || "📚")} ${esc(subject?.name || item.subjectName || "Bài tập")}</span>
        <span class="date">${esc(fmt(item.createdAt || item.updatedAt))}</span>
      </div>
      <h2>${esc(item.title || "Bài tập")}</h2>
      <div class="content">${esc(item.content || "")}</div>
      ${item.dueDate ? `<p class="muted">⏰ Hạn nộp: ${esc(fmt(item.dueDate))}</p>` : ""}
      ${links.length ? `<div class="links">${links.map((url,i) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 Mở link ${i+1}</a>`).join("")}</div>` : ""}
    </article>`;
  }).join("");
}

$("search").addEventListener("input", event => {
  search = event.target.value;
  render();
});

onSnapshot(collection(db, "subjects"), snapshot => {
  subjects = snapshot.docs.map(d => ({ id:d.id, ...d.data() }));
  subjectsReady = true;
  render();
}, error => {
  console.warn("BME subjects listener:", error);
  subjectsReady = true;
  render();
});

onSnapshot(collection(db, "bme_homework"), snapshot => {
  data = snapshot.docs.map(d => ({ id:d.id, ...d.data() }));
  bmeReady = true;
  render();
  console.log("Homework Hub BME: loaded", data.length, "items");
}, error => {
  console.error("Homework Hub BME listener error:", error);
  $("status").hidden = false;
  $("status").className = "error";
  $("status").textContent = `❌ Không thể tải bài BME: ${error.code || ""} ${error.message || ""}`;
});
</script>
</body>
</html>
