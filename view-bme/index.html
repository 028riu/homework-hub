<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>Homework Hub — View BME</title><style>body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#202534;margin:0}.wrap{max-width:980px;margin:auto;padding:28px 18px}.head,.card,.empty{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:14px}.head h1{margin:5px 0}.muted,.date{color:#667085}.search{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe3ea;border-radius:12px;font:inherit;margin-top:10px}.top{display:flex;justify-content:space-between;gap:10px}.subject{font-weight:800;color:#4f46e5}.card h2{font-size:21px}.content{white-space:pre-wrap;line-height:1.7}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.links a{padding:8px 11px;border:1px solid #dfe3ea;border-radius:10px;text-decoration:none;color:#344054}</style></head><body><main class="wrap"><section class="head"><div class="muted">PARENT VIEW</div><h1>👨‍👩‍👧 Bài tập</h1><div class="muted">Danh sách bài tập dành cho phụ huynh.</div><input id="search" class="search" placeholder="🔎 Tìm bài tập..."></section><section id="list"></section><div id="empty" class="empty" hidden>📭 Chưa có bài tập.</div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,query,orderBy,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'../js/firebase-config.js';const db=getFirestore(initializeApp(firebaseConfig));const $=x=>document.getElementById(x);let data=[],subjects=[],search='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>{try{const d=v?.toDate?v.toDate():new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleString('vi-VN')}catch{return''}};const links=h=>Array.isArray(h.links)?h.links.filter(Boolean):(h.link?[h.link]:(h.url?[h.url]:[]));function render(){const f=data.filter(h=>`${h.title||''} ${h.content||''}`.toLowerCase().includes(search));$('empty').hidden=f.length>0;$('list').innerHTML=f.map(h=>{const s=subjects.find(x=>x.id===h.subjectId),ls=links(h);return `<article class="card"><div class="top"><span class="subject">${esc(s?.icon||'📚')} ${esc(s?.name||'Bài tập')}</span><span class="date">${esc(fmt(h.createdAt))}</span></div><h2>${esc(h.title||'Bài tập')}</h2><div class="content">${esc(h.content||'')}</div>${h.dueDate?`<p class="muted">⏰ Hạn nộp: ${esc(fmt(h.dueDate))}</p>`:''}${ls.length?`<div class="links">${ls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">🔗 Link ${i+1}</a>`).join('')}</div>`:''}</article>`}).join('')}$('search').oninput=e=>{search=e.target.value.trim().toLowerCase();render()}}onSnapshot(query(collection(db,'subjects'),orderBy('order','asc')),s=>{subjects=s.docs.map(d=>({id:d.id,...d.data()}));render()});onSnapshot(query(collection(db,'bme_homework'),orderBy('createdAt','desc')),s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render()});</script></body></html>
